# LOCAL DEV stack — hot-reload with bind mounts.
# Use: npm run local:dev:up / local:dev:down
# See docker-compose.deploy.yml for local prod-test builds.
name: andy-code-cat

services:
  workspace:
    image: node:22.23.5-alpine
    container_name: andy-code-cat-workspace
    working_dir: /workspace
    command: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - ./:/workspace
    networks:
      - andy-code-cat-net

  mongodb:
    image: mongo:7
    container_name: andy-code-cat-mongodb
    restart: unless-stopped
    # Loopback only — MongoDB has no authentication in this stack.
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./data/mongodb:/data/db
    command: ["--bind_ip_all"]
    networks:
      - andy-code-cat-net

  # Optional object storage, only with: docker compose --profile minio up -d
  # (the API uses STORAGE_ADAPTER=local unless told otherwise).
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    container_name: andy-code-cat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - andy-code-cat-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: andy-code-cat-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/andy-code-cat
      - NODE_ENV=development
    depends_on:
      - workspace
      - mongodb
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages:/workspace/packages
      - ./docs/skills/template-skills:/workspace/docs/skills/template-skills:ro
      - /workspace/apps/api/node_modules
      - /workspace/packages/contracts/node_modules
      - ./data:/workspace/data
    networks:
      - andy-code-cat-net

  # Background runs (docs/specs/BACKGROUND_RUNS.md): the API code, a different entry point.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: andy-code-cat-worker
    restart: unless-stopped
    working_dir: /workspace/apps/api
    command: ["npx", "tsx", "watch", "src/worker.ts"]
    env_file:
      - .env.docker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/andy-code-cat
      - NODE_ENV=development
    depends_on:
      - mongodb
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages:/workspace/packages
      - ./docs/skills/template-skills:/workspace/docs/skills/template-skills:ro
      - /workspace/apps/api/node_modules
      - /workspace/packages/contracts/node_modules
      - ./data:/workspace/data
    networks:
      - andy-code-cat-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: andy-code-cat-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NODE_ENV=development
    depends_on:
      - workspace
      - api
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages:/workspace/packages
      - /workspace/apps/web/node_modules
      - /workspace/packages/contracts/node_modules
    networks:
      - andy-code-cat-net

  nginx:
    image: nginx:1.25-alpine
    container_name: andy-code-cat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Local HTTP-only config — no SSL certs needed.
      # Production SSL config lives in nginx/sites-enabled/<project>.conf (production hosts only, not tracked in git).
      - ./nginx/sites-enabled/local.conf:/etc/nginx/sites-enabled/local.conf:ro
      - ./data/www:/var/www/andy-code-cat:ro
    depends_on:
      - api
      - web
    networks:
      - andy-code-cat-net

networks:
  andy-code-cat-net:
    driver: bridge
