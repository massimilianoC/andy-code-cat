name: Public repo guard

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  guard:
    name: guard:public-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm run guard:public-repo
