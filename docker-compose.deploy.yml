# Explicit project name keeps volume names stable regardless of directory name.
# Volumes: andy-code-cat_mongodb_data, andy-code-cat_minio_data
#
# Network exposure: only nginx publishes ports on every interface. MongoDB, the API, the web
# server and MinIO are bound to 127.0.0.1 so they are reachable for local smoke tests and
# maintenance (`curl localhost:4000/health`, `mongosh --port 27018`) but never from the network.
# Docker writes its own iptables rules, so a host firewall (ufw, firewalld) does NOT protect a
# port published on 0.0.0.0 — keep these bindings on loopback.
name: andy-code-cat

services:
  mongodb:
    image: mongo:7
    container_name: andy-code-cat-mongodb
    restart: unless-stopped
    # Loopback only: for maintenance and seed scripts from the host. MongoDB has no
    # authentication in this stack, so it must never be published on a public interface.
    ports:
      - "127.0.0.1:${MONGO_EXTERNAL_PORT:-27018}:27017"
    command: ["--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - andy-code-cat-net

  # Optional object storage. The API uses the local storage adapter by default
  # (STORAGE_ADAPTER=local), so MinIO only starts when the "minio" profile is enabled:
  #   docker compose -f docker-compose.deploy.yml --profile minio up -d
  # Set STORAGE_ADAPTER=minio and real MINIO_ACCESS_KEY / MINIO_SECRET_KEY values first.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    container_name: andy-code-cat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - andy-code-cat-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    container_name: andy-code-cat-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/andy-code-cat
    depends_on:
      - mongodb
    # Loopback only, for curl/smoke tests from the host. Public traffic goes through nginx,
    # which applies the rate limits and security headers.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # The local storage adapter owns uploads, exports, workspaces, profiles,
      # thumbnails and published sites under this root. Persist it as one unit.
      - ./data:/workspace/data
      - ./docs/skills/template-skills:/workspace/docs/skills/template-skills:ro
    networks:
      - andy-code-cat-net

  # Background runs (docs/specs/BACKGROUND_RUNS.md): same image build as the API, different command.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    container_name: andy-code-cat-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/andy-code-cat
    depends_on:
      - mongodb
    volumes:
      - ./data:/workspace/data
      - ./docs/skills/template-skills:/workspace/docs/skills/template-skills:ro
    stop_grace_period: 15s
    networks:
      - andy-code-cat-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    container_name: andy-code-cat-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    expose:
      - "8081"
    # Loopback only, for local testing. Public traffic goes through nginx.
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - andy-code-cat-net

  nginx:
    image: nginx:1.25-alpine
    container_name: andy-code-cat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Local HTTP-only config — no SSL certs needed.
      # Production SSL config lives in nginx/sites-enabled/<project>.conf (production hosts only, not tracked in git).
      - ./nginx/sites-enabled/local.conf:/etc/nginx/sites-enabled/local.conf:ro
      - ./data/www:/var/www/andy-code-cat:ro
    depends_on:
      - api
      - web
    networks:
      - andy-code-cat-net

networks:
  andy-code-cat-net:
    driver: bridge

volumes:
  # project name "andy-code-cat" (from `name:` above) auto-prefixes these to:
  #   andy-code-cat_mongodb_data  and  andy-code-cat_minio_data
  mongodb_data:
  minio_data:
